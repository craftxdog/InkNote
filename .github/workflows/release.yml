name: Release

on:
  push:
    tags:
      - 'v*.*.*'

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  package:
    name: Package (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            platform: mac
            package-script: package:mac
          # Keep native-module rebuilding on the VS 2022 runner until the
          # electron-builder node-gyp chain supports Visual Studio 2026.
          - os: windows-2022
            platform: win
            package-script: package:win
          - os: ubuntu-latest
            platform: linux
            package-script: package:linux
    steps:
      - name: Checkout repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0

      - name: Setup Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run quality checks
        run: npm run verify

      - name: Smoke test Electron startup (Linux)
        if: ${{ runner.os == 'Linux' }}
        run: xvfb-run --auto-servernum npm run test:smoke

      - name: Smoke test Electron startup
        if: ${{ runner.os != 'Linux' }}
        run: npm run test:smoke

      - name: Build unsigned installers
        run: npm run ${{ matrix.package-script }}

      - name: Upload desktop installers
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: inknote-${{ matrix.platform }}
          path: |
            release/build/*.dmg
            release/build/*.zip
            release/build/*.exe
            release/build/*.AppImage
            release/build/*.deb
          if-no-files-found: error
          retention-days: 1

  publish:
    name: Publish GitHub Release
    needs: package
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download desktop installers
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          path: release-assets
          merge-multiple: true

      - name: Verify release asset set
        shell: bash
        run: |
          test "$(find release-assets -maxdepth 1 -type f | wc -l | tr -d ' ')" -eq 9

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: >-
          gh release create "${GITHUB_REF_NAME}" release-assets/*
          --verify-tag
          --generate-notes
