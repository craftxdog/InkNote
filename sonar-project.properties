# ==========================================================
# InkNote - SonarQube Cloud
# ==========================================================

sonar.projectKey=craftxdog_InkNote
sonar.projectName=InkNote
sonar.organization=craftxdog

sonar.sourceEncoding=UTF-8

# Source code
sonar.sources=src

# Tests
sonar.tests=src
sonar.test.inclusions=src/**/*.test.ts,src/**/*.test.tsx,src/**/__tests__/**/*.ts,src/**/__tests__/**/*.tsx

# Exclusions
sonar.exclusions=node_modules/**,release/**,coverage/**,.erb/**,assets/**,**/*.d.ts

# JavaScript / TypeScript coverage
sonar.javascript.lcov.reportPaths=coverage/lcov.info

# Quality Gate
sonar.qualitygate.wait=true
sonar.qualitygate.timeout=300
